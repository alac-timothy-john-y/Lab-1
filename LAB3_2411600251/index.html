<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Finance Tracker</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
        <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="card login-card shadow-lg" style="max-width: 400px; width: 100%;">
            <div class="card-header text-white text-center py-4">
                <h2 class="mb-0">FinTrack</h2>
                <p class="mb-0 small text-light">Login to your financial dashboard</p>
            </div>
            <div class="card-body p-4">
                <div id="loginFeedback"></div>
                <form id="loginForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" placeholder="Enter username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" placeholder="Enter password" required>
                    </div>
                    <button type="button" class="btn btn-primary w-100 py-2 mt-2" id="loginBtn">Login</button>
                </form>
                <div class="text-center mt-3">
                    <small class="text-muted">Demo: admin / password123</small>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle JS & Logic -->
    <script src="https://jsdelivr.net"></script>
    <script src="js/login.js"></script>
</body>
</html>
