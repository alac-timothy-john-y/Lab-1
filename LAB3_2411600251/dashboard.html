<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Finance Tracker</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
        <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">FinTrack Admin</a>
            <div class="ms-auto d-flex align-items-center">
                <span class="navbar-text text-white me-3" id="userDisplay">Welcome, <span id="userName">User</span></span>
                <button class="btn btn-outline-light btn-sm" id="logoutBtn">Logout</button>
            </div>
        </div>
    </nav>

    <!-- Main Application Layout -->
    <div class="container-fluid">
        <div class="row">
            <!-- Navigation Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar p-3 border-end">
                <ul class="nav flex-column">
                    <li class="nav-item mb-2"><a class="nav-link active rounded" href="#">Dashboard</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-dark" href="#">Expenses</a></li>
                    <li class="nav-item mb-2"><a class="nav-link text-dark" href="#">Savings Goals</a></li>
                    <li class="nav-item"><a class="nav-link text-danger" href="#" id="logoutLink">Logout</a></li>
                </ul>
            </nav>

            <!-- Main Content Area -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between align-items-center pb-2 mb-3 border-bottom">
                    <h2 id="greeting">Good Morning, User!</h2>
                </div>

<!-- 4 Simple Theme Metric Cards -->
<div class="row mb-4">
    <div class="col-md-3 mb-3">
        <div class="card stat-card text-center p-3 shadow-sm border-0 border-primary-custom">
            <h5 class="text-muted small" id="stat1-title">Total Balance</h5>
            <h2 class="fw-bold" style="color: var(--theme-primary);" id="stat1-value">$0</h2>
        </div>
    </div>
    <div class="col-md-3 mb-3">
        <div class="card stat-card text-center p-3 shadow-sm border-0 border-secondary-custom">
            <h5 class="text-muted small" id="stat2-title">Monthly Income</h5>
            <h2 class="fw-bold" style="color: var(--theme-secondary);" id="stat2-value">$0</h2>
        </div>
    </div>
    <div class="col-md-3 mb-3">
        <div class="card stat-card text-center p-3 shadow-sm border-0 border-accent-custom">
            <h5 class="text-muted small" id="stat3-title">Monthly Expenses</h5>
            <h2 class="fw-bold" style="color: var(--theme-accent);" id="stat3-value">$0</h2>
        </div>
    </div>
    <div class="col-md-3 mb-3">
        <div class="card stat-card text-center p-3 shadow-sm border-0 border-primary-custom" style="background-color: var(--theme-card-bg);">
            <h5 class="text-muted small" id="stat4-title">Savings Target</h5>
            <h2 class="fw-bold" style="color: var(--theme-primary);" id="stat4-value">0%</h2>
        </div>
    </div>
</div>

                <!-- Recent Financial Transactions Table -->
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-white fw-bold py-3">Recent Transactions</div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>Date</th>
                                        <th>Transaction / Activity</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody id="activityTableBody">
                                    <!-- Populated via Javascript -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Bootstrap Bundle JS & Logic -->
    <script src="https://jsdelivr.net"></script>
    <script src="js/dashboard.js"></script>
    
</body>
</html>
